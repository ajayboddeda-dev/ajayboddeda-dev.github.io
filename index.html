  function showTab(name) {
    sheet.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
    sheet.querySelectorAll('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== name; });
    const allImgs = Object.assign({}, state.images, imgs);
    if (name === 'preview') $('[data-pane="preview"]').innerHTML = '<h1 class="preview-title">' + (esc(title.value.trim()) || '<span class="muted">Untitled</span>') + '</h1><div class="prose">' + (body.value.trim() ? renderMD(body.value, allImgs) : '<p class="muted">Nothing to preview yet.</p>') + '</div>';
    if (name === 'check') $('[data-pane="check"]').innerHTML = checksHTML(body.value);
    $('.sheet-body').scrollTop = 0;
  }
  let delArmed = null;
  sheet.addEventListener('click', async e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.pick) {
      const on = t.getAttribute('aria-pressed') === 'true';
      if (on && picks().length === 1) { toast('Every entry needs at least one track.'); return; }
      t.setAttribute('aria-pressed', String(!on)); trkHint(); changed(); return;
    }
    if (t.dataset.tool) { toolFns[t.dataset.tool](); return; }
    if (t.dataset.tab) { showTab(t.dataset.tab); return; }
    if (t.hasAttribute('data-discard')) {
      store.del(key);
      Object.keys(imgs).forEach(k => delete imgs[k]);
      title.value = base.title; setPicks(base.tracks); date.value = base.date; tags.value = base.tags; body.value = base.body; medium.value = base.medium; linkedin.value = base.linkedin;
      const n = $('[data-notice]'); if (n) n.remove();
      updateCount(); grow(); toast('Draft discarded.');
      return;
    }
    if (t.hasAttribute('data-delete')) {
      if (!delArmed) {
        t.classList.add('armed'); t.textContent = 'Tap again to delete';
        delArmed = setTimeout(() => { delArmed = null; t.classList.remove('armed'); t.textContent = 'Delete entry'; }, 3500);
        return;
      }
      clearTimeout(delArmed);
      busy = true; t.disabled = true; t.textContent = 'Deleting…';
      const next = cloneState();
      next.posts = next.posts.filter(p => p.id !== existing.id);
      const ok = await doPublish(next, '/', key, 'Entry deleted.', 'Delete entry: ' + existing.title);
      if (!ok) { busy = false; t.disabled = false; t.classList.remove('armed'); t.textContent = 'Delete entry'; delArmed = null; }
      return;
    }
    if (t.hasAttribute('data-publish')) publish();
  });
  async function publish() {
    if (busy) return;
    const m = collect();
    if (!m.title.trim()) { showTab('write'); toast('Add a title before publishing.'); title.focus(); return; }
    if (!m.body.trim()) { showTab('write'); toast('Write something before publishing.'); body.focus(); return; }
    if (!m.tracks.length) { showTab('write'); toast('Pick at least one track.'); return; }
    saveDraft();
    busy = true; pubBtn.disabled = true; pubBtn.textContent = existing ? 'Saving…' : 'Publishing…';
    const next = cloneState();
    const now = Date.now();
    const pid = existing ? existing.id : newId();
    const tagList = [...new Set(m.tags.split(',').map(x => x.trim().toLowerCase().replace(/^#+/, '').replace(/\s+/g, '-')).filter(Boolean))].slice(0, 8);
    const post = {
      id: pid, title: m.title.trim().slice(0, 140), tracks: m.tracks, date: validKey(m.date) ? m.date : todayKey(), tags: tagList,
      body: m.body.replace(/\u0000/g, ''), medium: normUrl(m.medium), linkedin: normUrl(m.linkedin),
      created: existing ? existing.created || now : now, updated: now
    };
    if (existing) next.posts = next.posts.map(p => p.id === pid ? post : p); else next.posts.push(post);
    Object.assign(next.images, imgs);
    store.set('po-last-tracks', m.tracks.join(','));
    const ok = await doPublish(next, '/post/' + pid, key, existing ? 'Changes saved.' : 'Published. Nice work showing up today.', (existing ? 'Update entry: ' : 'New entry: ') + post.title);
    if (!ok) { busy = false; pubBtn.disabled = false; pubBtn.textContent = existing ? 'Save changes' : 'Publish'; }
  }
  sheet.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); publish(); return; }
    if (e.target === title && e.key === 'Enter') { e.preventDefault(); body.focus(); }
  });
  updateCount();
  requestAnimationFrame(() => { grow(); (existing ? body : title).focus({ preventScroll: true }); });
}

/* ---------------- profile settings ---------------- */
function openSettings() {
  const p = state.profile;
  let photo = p.photo || '';
  const sheet = makeSheet(
    '<div class="sheet-bar"><button type="button" class="btn ghost" data-close>Close</button><h2 id="set-h">Edit profile</h2>' +
    '<button type="button" class="btn primary" data-save>Save profile</button></div>' +
    '<div class="sheet-body"><div class="form">' +
    '<div class="photo-row"><div class="photo-prev"></div><div class="photo-actions">' +
    '<label class="btn ghost file-btn">Upload photo<input type="file" accept="image/*" hidden data-photo></label>' +
    '<button type="button" class="btn ghost" data-photo-remove>Remove</button>' +
    '<p class="hint">A clear, well-lit face works best. It is cropped square and resized for you.</p></div></div>' +
    '<label class="field">Name<input name="name" maxlength="60" autocomplete="name"></label>' +
    '<label class="field">Tagline<input name="tagline" maxlength="120" placeholder="I take hard ideas apart until they’re simple."></label>' +
    '<label class="field">Short bio<textarea name="bio" rows="4" maxlength="420"></textarea></label>' +
    '<fieldset class="group"><legend>Where people can find you</legend>' +
    '<label class="field">Medium profile<input name="medium" inputmode="url" placeholder="https://medium.com/@yourname" autocapitalize="off"></label>' +
    '<label class="field">LinkedIn profile<input name="linkedin" inputmode="url" placeholder="https://www.linkedin.com/in/yourname" autocapitalize="off"></label>' +
    '<label class="field">GitHub (optional)<input name="github" inputmode="url" placeholder="https://github.com/yourname" autocapitalize="off"></label>' +
    '<label class="field">Email (optional)<input name="email" type="email" placeholder="you@example.com" autocapitalize="off"></label></fieldset>' +
    '<fieldset class="group"><legend>Your three tracks</legend><p class="hint">Each track has its own page and circle. Rename them or change what they say.</p>' +
    TRACK_KEYS.map(k => '<div class="trk-edit" data-trk="' + k + '"><label class="field">Track name<input name="tn-' + k + '" maxlength="40"></label><label class="field">What you explore here<textarea name="td-' + k + '" rows="2" maxlength="200"></textarea></label></div>').join('') +
    '<details class="help-x"><summary>Crossroads descriptions</summary>' +
    CROSS_KEYS.map(rk => '<label class="field">' + esc(rk === 'de-sec-ai' ? 'All three tracks' : regionName(rk)) + '<textarea name="cd-' + rk + '" rows="2" maxlength="200"></textarea></label>').join('') +
    '</details></fieldset>' +
    '<section class="group"><h3>Storage</h3><div class="meter"><span></span></div><p class="hint" data-storage>Measuring…</p></section>' +
    '<section class="group"><h3>Publish on GitHub</h3><p class="hint">Downloads index.html with your profile and every published entry. Upload it to your GitHub repository to update the public copy there. Save profile changes first: the file holds what is already published.</p>' +
    '<label class="field">Public site address<input name="site" inputmode="url" placeholder="https://yourname.github.io" autocapitalize="off"></label>' +
    '<p class="hint">Used for the link preview on LinkedIn. Keep thumbnail.png in the same GitHub repository.</p>' +
    (cap.gh
      ? '<p class="hint">Connected to ' + esc(cap.gh.repo) + '. Every publish here saves straight to GitHub.</p><div><button type="button" class="btn ghost" data-signout>Sign out on this device</button></div>'
      : '<div><button type="button" class="btn ghost" data-download>Download index.html</button></div>') + '</section>' +
    '</div></div>'
  );
  sheet.querySelector('.sheet-panel').setAttribute('aria-labelledby', 'set-h');
  const $ = s => sheet.querySelector(s);
  const f = { name: $('[name=name]'), tagline: $('[name=tagline]'), bio: $('[name=bio]'), medium: $('[name=medium]'), linkedin: $('[name=linkedin]'), github: $('[name=github]'), email: $('[name=email]') };
  f.name.value = p.name; f.tagline.value = p.tagline; f.bio.value = p.bio;
  $('[name=site]').value = p.site || '';
  f.medium.value = p.links.medium; f.linkedin.value = p.links.linkedin; f.github.value = p.links.github; f.email.value = p.links.email;
  TRACK_KEYS.forEach(k => { $('[name="tn-' + k + '"]').value = p.tracks[k].name; $('[name="td-' + k + '"]').value = p.tracks[k].desc; });
  CROSS_KEYS.forEach(rk => { $('[name="cd-' + rk + '"]').value = p.cross[rk] || ''; });
  const prev = $('.photo-prev');
  const paintPhoto = () => { prev.innerHTML = photo ? '<img src="' + esc(photo) + '" alt="">' : '<span class="monogram" aria-hidden="true">' + esc(initials(f.name.value || 'You')) + '</span>'; };
  paintPhoto();
  f.name.addEventListener('input', () => { if (!photo) paintPhoto(); });
  $('[data-photo]').addEventListener('change', async ev => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    try { photo = await compressImage(file, 560, true); paintPhoto(); toast('Photo ready. Save the profile to publish it.'); }
    catch (e) { toast('That file couldn’t be read as an image. Try a JPG or PNG.', 4500); }
  });
  $('[data-photo-remove]').addEventListener('click', () => { photo = ''; paintPhoto(); });
  const so = $('[data-signout]'); if (so) so.addEventListener('click', ghSignOut);
  const dlBtn = $('[data-download]'); if (dlBtn) dlBtn.addEventListener('click', async ev => {
    const btn = ev.currentTarget;
    if (!cap.downloads) { toast('Downloading works when you open this page from your Claude account.', 5000); return; }
    btn.disabled = true;
    try {
      await cap.downloads.save({ filename: 'index.html', data: new Blob([buildHTML(state)], { type: 'text/html' }) });
      toast('index.html is ready. Upload it to your GitHub repository.', 5000);
    } catch (e) {
      const c = e && e.code;
      if (c === 'declined') { /* viewer chose not to save */ }
      else if (c === 'rate_limited') toast('A download prompt is already open.');
      else if (c === 'extension_not_enabled' || c === 'rejected_extension') toast('HTML downloads aren’t available in this view. Ask Claude for the file instead.', 6000);
      else toast('The download didn’t start. Try again in a moment.', 5000);
    } finally { btn.disabled = false; }
  });
  requestAnimationFrame(() => {
    const html = buildHTML(state), used = new Blob([html]).size;
    const imgBytes = Object.values(state.images).reduce((a, v) => a + Math.round(String(v).length * 0.75), 0) + Math.round((state.profile.photo || '').length * 0.75);
    const perEntry = state.posts.length ? Math.max(2500, Math.round(state.posts.reduce((a, x) => a + JSON.stringify(x).length, 0) / state.posts.length)) : 6000;
    const room = Math.max(0, Math.floor((MAX_BYTES - used) / perEntry));
    $('.meter span').style.width = Math.max(1.5, Math.min(100, used / MAX_BYTES * 100)) + '%';
    $('[data-storage]').textContent = fmtBytes(used) + ' of 16 MB used, ' + fmtBytes(imgBytes) + ' of it images. A text entry like yours takes about ' + fmtBytes(perEntry) + ', so there is room for roughly ' + room.toLocaleString() + ' more. Images fill space fastest.';
  });
  let busy = false;
  $('[data-save]').addEventListener('click', async ev => {
    if (busy) return;
    const btn = ev.currentTarget;
    const email = f.email.value.trim();
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('That email address looks incomplete.'); f.email.focus(); return; }
    busy = true; btn.disabled = true; btn.textContent = 'Saving…';
    const next = cloneState();
    next.profile = {
      name: f.name.value.trim().slice(0, 60), tagline: f.tagline.value.trim().slice(0, 120), bio: f.bio.value.trim().slice(0, 420), photo,
      links: { medium: normUrl(f.medium.value), linkedin: normUrl(f.linkedin.value), github: normUrl(f.github.value), email },
      tracks: {}, cross: {}, site: normUrl($('[name=site]').value).replace(/\/+$/, '')
    };
    TRACK_KEYS.forEach(k => { next.profile.tracks[k] = { name: $('[name="tn-' + k + '"]').value.trim().slice(0, 40) || TRACK_DEFAULTS[k].name, desc: $('[name="td-' + k + '"]').value.trim().slice(0, 200) }; });
    CROSS_KEYS.forEach(rk => { next.profile.cross[rk] = $('[name="cd-' + rk + '"]').value.trim().slice(0, 200); });
    const ok = await doPublish(next, currentPath, '', 'Profile saved.', 'Update profile');
    if (!ok) { busy = false; btn.disabled = false; btn.textContent = 'Save profile'; }
  });
  requestAnimationFrame(() => f.name.focus({ preventScroll: true }));
}

/* ---------------- global events ---------------- */
document.addEventListener('click', async e => {
  if (e.target.closest('.sheet')) return;
  const inst = e.target.closest('[data-install]');
  if (inst) { installUpdate(inst); return; }
  const el = e.target.closest('[data-day],[data-go],[data-new],[data-new-project],[data-edit],[data-edit-project],[data-new-org],[data-edit-org],[data-lightbox],[data-sec],[data-3d-spin],[data-3d-reset],[data-profile],[data-theme-toggle],[data-copy],[data-topic],[data-topic-go],[data-author]');
  if (!el) return;
  if (el.hasAttribute('data-day')) { selectDay(el); return; }
  if (el.hasAttribute('data-new-project')) { if (cap.owner) openProjectEditor(null, { tracks: el.getAttribute('data-preset') || '', kind: el.getAttribute('data-kind') || '', org: el.getAttribute('data-org') || '' }); return; }
  if (el.hasAttribute('data-edit-project')) { e.preventDefault(); if (cap.owner) openProjectEditor(el.getAttribute('data-edit-project')); return; }
  if (el.hasAttribute('data-new-org')) { if (cap.owner) openOrgEditor(); return; }
  if (el.hasAttribute('data-edit-org')) { e.preventDefault(); if (cap.owner) openOrgEditor(el.getAttribute('data-edit-org')); return; }
  if (el.hasAttribute('data-lightbox')) { openLightbox(el.getAttribute('data-lightbox')); return; }
  if (el.hasAttribute('data-sec')) {
    const s = document.getElementById(el.getAttribute('data-sec'));
    if (s) window.scrollTo({ top: s.getBoundingClientRect().top + window.scrollY - 70, behavior: reduceMotion ? 'auto' : 'smooth' });
    return;
  }
  if (el.hasAttribute('data-3d-spin') || el.hasAttribute('data-3d-reset')) { viewerButton(el); return; }
  if (el.hasAttribute('data-go')) {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); go(el.getAttribute('data-go')); return;
  }
  if (el.hasAttribute('data-new')) { if (cap.owner) openEditor(null, el.getAttribute('data-preset') || ''); return; }
  if (el.hasAttribute('data-edit')) { if (cap.owner) openEditor(el.getAttribute('data-edit')); return; }
  if (el.hasAttribute('data-profile')) { if (cap.owner) openSettings(); return; }
  if (el.hasAttribute('data-theme-toggle')) { const nt = currentTheme() === 'dark' ? 'light' : 'dark'; applyTheme(nt); store.set('po-theme', nt); return; }
  if (el.hasAttribute('data-copy')) {
    const pre = el.closest('.code').querySelector('pre');
    const ok = await copyText(pre ? pre.textContent : '');
    el.textContent = ok ? 'Copied' : 'Select to copy';
    setTimeout(() => { el.textContent = 'Copy'; }, 1800);
    return;
  }
  if (el.hasAttribute('data-topic')) {
    filter.topic = el.getAttribute('data-topic');
    document.querySelectorAll('.topic').forEach(b => b.setAttribute('aria-pressed', String(b.getAttribute('data-topic') === filter.topic)));
    const list = document.getElementById('list'); if (list) list.innerHTML = listItemsHTML(false);
    return;
  }
  if (el.hasAttribute('data-topic-go')) { filter.topic = el.getAttribute('data-topic-go'); filter.q = ''; go('/', 'entries'); return; }
  if (el.hasAttribute('data-author')) {
    if (onGitHub) { openConnect(); return; }
    cap.owner = true;
    document.documentElement.classList.add('is-owner');
    toast('Author tools are on. If this account can’t publish, saving will say so.', 5000);
  }
});
function vennAnchor(e) { return e.target && e.target.closest ? e.target.closest('.venn [data-hl]') : null; }
function hlVenn(a) {
  const v = a.closest('.venn'); if (!v) return;
  v.setAttribute('data-hl', a.dataset.hl);
  const c = v.querySelector('.v-cap'); if (c) c.textContent = a.dataset.cap;
}
function clearVenn(a) {
  const v = a.closest('.venn'); if (!v) return;
  v.removeAttribute('data-hl');
  const c = v.querySelector('.v-cap'); if (c) c.textContent = c.dataset.default;
}
document.addEventListener('mouseover', e => {
  const a = vennAnchor(e); if (a) hlVenn(a);
  const c = e.target && e.target.closest ? e.target.closest('.cell[data-day]') : null;
  if (c && window.matchMedia && matchMedia('(hover: hover)').matches) selectDay(c);
});
document.addEventListener('focusin', e => { const a = vennAnchor(e); if (a) hlVenn(a); });
document.addEventListener('mouseout', e => { const a = vennAnchor(e); if (a && !(e.relatedTarget && a.contains(e.relatedTarget))) clearVenn(a); });
document.addEventListener('focusout', e => { const a = vennAnchor(e); if (a) clearVenn(a); });
document.addEventListener('input', e => {
  if (e.target.matches && e.target.matches('.search input')) {
    filter.q = e.target.value;
    const list = document.getElementById('list'); if (list) list.innerHTML = listItemsHTML(false);
  }
});

/* ---------------- capabilities ---------------- */
async function initCaps() {
  if (onGitHub) {
    document.documentElement.classList.add('maybe-owner');
    const tok = store.get('po-gh-token'), repo = store.get('po-gh-repo') || ghRepoGuess();
    if (tok && repo) await ghConnect(tok, repo, true);
    if (!cap.gh) refreshFromOrigin();
    showUpdateBar();
    return;
  }
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  let art = null, usr = null, dl = null;
  try {
    [art, usr, dl] = await Promise.all([
      window.claude.use('artifact').catch(() => null),
      window.claude.use('user').catch(() => null),
      window.claude.use('downloads').catch(() => null)
    ]);
  } catch (e) { return; }
  cap.artifact = art; cap.user = usr; cap.downloads = dl;
  if (!art || cap.readOnly) return;
  let can = false;
  if (usr) {
    try { can = await usr.canEdit(); } catch (e) { can = false; }
    if (can) { cap.owner = true; document.documentElement.classList.add('is-owner'); }
  } else {
    document.documentElement.classList.add('maybe-owner');
  }
}

/* ---------------- boot ---------------- */
applyAfter();
render();
booted = true;
setTimeout(() => { const b = document.querySelector('.board.intro'); if (b) b.classList.remove('intro'); }, 2600);
initCaps();
})();
